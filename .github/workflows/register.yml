name: BytePlus Register
on:
  workflow_dispatch:
    inputs:
      attempt:
        description: Attempt number
        required: false
        default: '1'

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Register
        run: python3 reg.py

      - name: Show log
        if: always()
        run: echo "--- done ---"
